<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asmin 💙</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#2563eb,#38bdf8);
font-family:Arial,sans-serif;
overflow:hidden;
}

.card{
background:rgba(255,255,255,0.12);
padding:40px;
border-radius:25px;
text-align:center;
color:white;
max-width:700px;
backdrop-filter:blur(12px);
box-shadow:0 0 30px rgba(0,0,0,0.3);
}

h1{
font-size:2rem;
line-height:1.5;
}

.heart{
font-size:3rem;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.25);}
100%{transform:scale(1);}
}
</style>
</head>

<body>
<div class="card">
<div class="heart">💙</div>
<h1>Asmin sen yazma diyince bende reels atıyorum 💙</h1>
</div>
</body>
</html>
